[tool.poetry]
name = "trashsort"
version = "0.1.0"
description = "Trash Classification"
authors = ["Olya"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.3.0"
torchvision = "^0.18.0"
pytorch-lightning = "^2.3.0"
torchmetrics = "^1.4.0"
hydra-core = "^1.3.2"
mlflow = "^2.14.0"
dvc = "^3.0.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
scikit-learn = "^1.5.0"
pillow = "^10.0.0"
matplotlib = "^3.8.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
python-multipart = "^0.0.29"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"
pre-commit = "^3.7.0"
ruff = "^0.5.0"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I"]
